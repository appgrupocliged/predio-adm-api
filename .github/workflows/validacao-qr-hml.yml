name: Validacao QR multiunidade (sem deploy)
on:
  push:
    branches:
      - homologacao/multiunidade-v1
    paths:
      - 'homologacao/**'
      - '.github/workflows/validacao-qr-hml.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Valida catalogo e identificacao de QR
        run: node --test homologacao/resolver-unidades.test.mjs
      - name: Valida endpoints HML sem TomTicket
        run: node --test homologacao/worker-hml.test.mjs
      - name: Valida nucleo operacional isolado
        run: node --test homologacao/operacao-core.test.mjs

      - name: Valida persistencia idempotente simulada
        run: node --test homologacao/persistencia-d1.test.mjs

      - name: Valida planos simulados TomTicket e Google Chat
        run: node --test homologacao/planos-integracao-hml.test.mjs

      - name: Valida reserva HML protegida no D1 simulado
        run: node --test homologacao/reserva-hml.test.mjs

      - name: Valida auditoria autenticada HML
        run: node --test homologacao/auditoria-hml.test.mjs
